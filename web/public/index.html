<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MARTA Receipts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222c;
        --ink: #e8eef4;
        --muted: #8b9aab;
        --accent: #f5a623;
        --line: #2a3542;
        --good: #3dd68c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #243041 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #2a1f0f 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        padding: 1.5rem 1.5rem 0.5rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        letter-spacing: -0.02em;
      }
      h1 span { color: var(--accent); }
      .sub {
        color: var(--muted);
        margin-top: 0.35rem;
        font-size: 0.95rem;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem 1.5rem 2.5rem;
        display: grid;
        gap: 1.25rem;
      }
      section {
        background: color-mix(in srgb, var(--panel) 92%, black);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.1rem 1.2rem;
      }
      section h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .chart-wrap { position: relative; height: 340px; }
      .status {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .chat-log {
        min-height: 120px;
        max-height: 280px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        margin-bottom: 0.85rem;
        padding-right: 0.25rem;
      }
      .bubble {
        padding: 0.7rem 0.85rem;
        border-radius: 10px;
        line-height: 1.45;
        font-size: 0.95rem;
      }
      .bubble.user {
        background: #243041;
        align-self: flex-end;
        max-width: 85%;
        white-space: pre-wrap;
      }
      .bubble.bot {
        background: #1e2a22;
        border: 1px solid color-mix(in srgb, var(--good) 35%, var(--line));
        border-left: 3px solid var(--good);
        align-self: flex-start;
        max-width: 95%;
      }
      .bubble.bot.tone-worst {
        border-left-color: #e86b6b;
        background: #241a1a;
      }
      .bubble.bot.tone-ghost {
        border-left-color: #94a3b8;
        background: #1a1e24;
      }
      .bubble.bot.tone-gap {
        border-left-color: #f5a623;
        background: #241e14;
      }
      .bubble.error {
        background: #2a1a1a;
        border: 1px solid #5c2b2b;
        white-space: pre-wrap;
      }
      .bubble.bot .md p { margin: 0 0 0.55rem; }
      .bubble.bot .md p:last-child { margin-bottom: 0; }
      .bubble.bot .md ol,
      .bubble.bot .md ul {
        margin: 0.35rem 0 0.55rem;
        padding-left: 1.25rem;
      }
      .bubble.bot .md li { margin: 0.2rem 0; }
      .bubble.bot .md strong { color: #fff; font-weight: 700; }
      .bubble.bot .md h1,
      .bubble.bot .md h2,
      .bubble.bot .md h3 {
        margin: 0.4rem 0 0.35rem;
        font-size: 1rem;
        color: var(--accent);
      }
      .stat-chip {
        display: inline-block;
        padding: 0.05rem 0.35rem;
        border-radius: 4px;
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        color: #ffd891;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input[type="text"] {
        flex: 1;
        background: #121820;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 8px;
        padding: 0.7rem 0.85rem;
        font-size: 0.95rem;
      }
      input[type="text"]:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
        border-color: var(--accent);
      }
      button {
        background: var(--accent);
        color: #1a1205;
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .hints {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.65rem;
      }
      .hints button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        font-weight: 500;
        font-size: 0.8rem;
        padding: 0.35rem 0.55rem;
      }
      .report-card {
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
        background: linear-gradient(145deg, #1f1a12 0%, #1a222c 60%);
        border-radius: 12px;
        padding: 1rem 1.1rem 1.15rem;
      }
      .report-card .report-meta {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 0.65rem;
      }
      .report-card .report-body {
        line-height: 1.5;
        white-space: pre-wrap;
        margin-top: 0.55rem;
        font-size: 0.98rem;
      }
      .report-actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .report-actions button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line));
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MARTA <span>Receipts</span></h1>
      <p class="sub">Live reliability from GTFS-RT → Timescale → Gemini</p>
    </header>
    <main>
      <section>
        <h2>On-time % by route (last 4 hours)</h2>
        <div class="status" id="chartStatus">Loading…</div>
        <div class="chart-wrap">
          <canvas id="reliabilityChart"></canvas>
        </div>
      </section>
      <section class="report-card">
        <h2>Reliability report card</h2>
        <div class="report-actions">
          <button type="button" id="reportBtn">Generate Report Card</button>
          <button type="button" class="secondary" id="pdfBtn">Download PDF Report</button>
          <button type="button" class="secondary" id="reportClearBtn" hidden>Clear</button>
        </div>
        <div class="status" id="reportStatus"></div>
        <div class="report-body" id="reportBody" hidden></div>
        <div class="report-meta" id="reportMeta" hidden></div>
      </section>
      <section>
        <h2>Ask the data</h2>
        <div class="chat-log" id="chatLog"></div>
        <form id="chatForm">
          <input
            id="question"
            type="text"
            placeholder="Which routes are worst today?"
            autocomplete="off"
            required
          />
          <button type="submit" id="askBtn">Ask</button>
        </form>
        <div class="hints">
          <button type="button" data-q="What are the worst routes today?">Worst today</button>
          <button type="button" data-q="Any ghost buses right now?">Ghost buses</button>
          <button type="button" data-q="How reliable is route 110 over the last 4 hours?">Route 110</button>
          <button type="button" data-q="Any service gaps on route 20 in the last 2 hours?">Headway gaps 20</button>
        </div>
      </section>
    </main>
    <script>
      const palette = [
        "#f5a623", "#3dd68c", "#5b8def", "#e86b6b", "#c084fc",
        "#22d3ee", "#f472b6", "#a3e635", "#fb923c", "#94a3b8",
      ];

      async function loadChart() {
        const status = document.getElementById("chartStatus");
        try {
          const res = await fetch("/api/reliability?hours=4");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "failed");

          const rows = data.rows || [];
          if (rows.length === 0) {
            status.textContent = "No reliability data yet — run the poller a few times.";
            return;
          }

          const buckets = [...new Set(rows.map((r) => r.bucket))].sort();
          const routes = [...new Set(rows.map((r) => r.route_id))].sort();
          const byRoute = Object.fromEntries(
            routes.map((route) => [
              route,
              Object.fromEntries(
                rows.filter((r) => r.route_id === route).map((r) => [r.bucket, Number(r.on_time_pct)])
              ),
            ])
          );

          // Limit legend noise: top routes by sample presence
          const routeCounts = routes.map((route) => ({
            route,
            n: rows.filter((r) => r.route_id === route).length,
          }));
          routeCounts.sort((a, b) => b.n - a.n);
          const shown = routeCounts.slice(0, 12).map((x) => x.route);

          status.textContent = `${shown.length} routes · ${buckets.length} buckets · last 4h`;

          const ctx = document.getElementById("reliabilityChart");
          new Chart(ctx, {
            type: "line",
            data: {
              labels: buckets.map((b) => {
                const d = new Date(b);
                return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
              }),
              datasets: shown.map((route, i) => ({
                label: route,
                data: buckets.map((b) => byRoute[route][b] ?? null),
                borderColor: palette[i % palette.length],
                backgroundColor: "transparent",
                tension: 0.25,
                spanGaps: true,
                pointRadius: 2,
                borderWidth: 2,
              })),
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "nearest", intersect: false },
              plugins: {
                legend: {
                  labels: { color: "#8b9aab", boxWidth: 12, font: { size: 11 } },
                },
                tooltip: {
                  callbacks: {
                    label: (c) => `${c.dataset.label}: ${c.parsed.y?.toFixed?.(1) ?? "—"}%`,
                  },
                },
              },
              scales: {
                x: {
                  ticks: { color: "#8b9aab", maxRotation: 0 },
                  grid: { color: "#2a3542" },
                },
                y: {
                  min: 0,
                  max: 100,
                  title: { display: true, text: "On-time %", color: "#8b9aab" },
                  ticks: { color: "#8b9aab" },
                  grid: { color: "#2a3542" },
                },
              },
            },
          });
        } catch (err) {
          status.textContent = `Chart error: ${err.message}`;
        }
      }

      function chatTone(question) {
        const q = (question || "").toLowerCase();
        if (/ghost/.test(q)) return "tone-ghost";
        if (/gap|headway/.test(q)) return "tone-gap";
        if (/worst|reliab|on-time|route \d/.test(q)) return "tone-worst";
        return "";
      }

      function highlightStats(html) {
        // Emphasize standalone percentages like 29.2%
        return html.replace(
          /(\d+(?:\.\d+)?%)/g,
          '<span class="stat-chip">$1</span>'
        );
      }

      function addBubble(text, kind, tone) {
        const log = document.getElementById("chatLog");
        const el = document.createElement("div");
        el.className = `bubble ${kind}${tone ? " " + tone : ""}`;
        if (kind === "bot" && window.marked) {
          const wrap = document.createElement("div");
          wrap.className = "md";
          wrap.innerHTML = highlightStats(marked.parse(text, { breaks: true }));
          el.appendChild(wrap);
        } else {
          el.textContent = text;
        }
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      async function ask(question) {
        const btn = document.getElementById("askBtn");
        addBubble(question, "user");
        btn.disabled = true;
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "chat failed");
          addBubble(data.answer, "bot", chatTone(question));
        } catch (err) {
          addBubble(err.message, "error");
        } finally {
          btn.disabled = false;
        }
      }

      document.getElementById("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("question");
        const q = input.value.trim();
        if (!q) return;
        input.value = "";
        ask(q);
      });

      document.querySelectorAll(".hints button").forEach((btn) => {
        btn.addEventListener("click", () => ask(btn.dataset.q));
      });

      document.getElementById("reportBtn").addEventListener("click", async () => {
        const btn = document.getElementById("reportBtn");
        const status = document.getElementById("reportStatus");
        const body = document.getElementById("reportBody");
        const meta = document.getElementById("reportMeta");
        const clearBtn = document.getElementById("reportClearBtn");
        btn.disabled = true;
        status.textContent = "Generating report…";
        body.hidden = true;
        meta.hidden = true;
        try {
          const res = await fetch("/api/report");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "report failed");
          body.textContent = data.report;
          body.hidden = false;
          meta.textContent = `Generated ${new Date(data.generated_at).toLocaleString()}`;
          meta.hidden = false;
          clearBtn.hidden = false;
          status.textContent = "";
        } catch (err) {
          status.textContent = `Report error: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("pdfBtn").addEventListener("click", () => {
        const status = document.getElementById("reportStatus");
        status.textContent = "Building PDF (calls Gemini)…";
        // Navigate so the browser downloads the attachment
        const a = document.createElement("a");
        a.href = "/api/report/pdf";
        a.download = "";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => {
          if (status.textContent.includes("Building PDF")) {
            status.textContent = "PDF download started.";
          }
        }, 1500);
      });

      document.getElementById("reportClearBtn").addEventListener("click", () => {
        document.getElementById("reportBody").hidden = true;
        document.getElementById("reportMeta").hidden = true;
        document.getElementById("reportStatus").textContent = "";
        document.getElementById("reportClearBtn").hidden = true;
      });

      loadChart();
    </script>
  </body>
</html>
